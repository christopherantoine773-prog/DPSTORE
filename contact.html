<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support & Équipe DPSTORE</title>
<!-- Importation des logos FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* --- BASE & STYLE DES AUTRES FICHIERS --- */
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f8fafc;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- HEADER --- */
  header {
    text-align: center;
    padding: 30px 15px;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  header h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #38bdf8;
    font-weight: 700;
  }

  /* --- CONTAINER & CARD --- */
  .container {
    max-width: 650px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .card-box {
    background: rgba(30, 41, 59, 0.6);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid #334155;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
  }

  /* --- MEMBRE --- */
  .member {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid #334155;
    transition: 0.3s;
  }

  .member:hover {
    border-color: #38bdf8;
    box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .name {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .name strong {
    color: #f8fafc;
    font-size: 1.05rem;
  }

  .info span {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  /* --- BADGE PRO --- */
  .badge {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0ea5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 8px rgba(14, 165, 233, 0.6);
  }

  .badge::before {
    content: "✓";
    color: white;
    font-size: 10px;
    font-weight: bold;
  }

  /* --- CONTACTS & LIENS --- */
  .contact {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    color: #ffffff !important;
    transition: 0.2s;
  }
  .contact-btn:hover {
    transform: translateY(-2px);
  }

  .btn-whatsapp { background: #25D366; }
  .btn-whatsapp:hover { background: #1EBE5D; }

  .btn-discord { background: #5865F2; }
  .btn-discord:hover { background: #4752C4; }

  .btn-email { background: #ea4335; }
  .btn-email:hover { background: #d33828; }

  /* --- ZONE MESSAGE D'AIDE --- */
  .help-box {
    margin-top: 30px;
    background: rgba(15, 23, 42, 0.5);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #334155;
  }

  .help-box h2 {
    color: #38bdf8;
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 1.2rem;
  }

  textarea {
    width: 100%;
    height: 100px;
    box-sizing: border-box;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #0f172a;
    color: #f8fafc;
    padding: 12px;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    transition: 0.3s;
  }

  textarea:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  button.submit-btn {
    width: 100%;
    margin-top: 15px;
    background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
    border: none;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
  }

  button.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
  }

  .back {
    display: inline-block;
    margin-top: 25px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: 0.2s;
  }

  .back:hover {
    color: #0ea5e9;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
  }

  .footer {
    text-align: center;
    color: #94a3b8;
    margin-top: 30px;
    font-size: 0.85rem;
    padding-bottom: 30px;
  }
</style>
</head>
<body>
  <header>
    <h1>Support & Équipe DPSTORE</h1>
  </header>

  <div class="container">
    <div class="card-box">

      <!-- Ton unique profil configuré avec tes liens précis -->
      <div class="member">
        <div class="info">
          <div class="name"><strong>Christopher Antoine</strong><div class="badge"></div></div>
          <span>christopherantoine773@gmail.com</span>
        </div>
        <div class="contact">
          <a href="https://wa.me/13478575829" target="_blank" class="contact-btn btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>
          <a href="https://discord.com/channels/1480426047186141266/1536904547132244079" target="_blank" class="contact-btn btn-discord">
            <i class="fa-brands fa-discord"></i>
          </a>
          <a href="mailto:christopherantoine773@gmail.com" class="contact-btn btn-email">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </div>
      </div>

      <div class="help-box">
        <h2>Envoyer un message d’aide 💬</h2>
        <textarea id="helpMessage" placeholder="Décris ton problème ici..."></textarea>
        <button class="submit-btn" onclick="sendHelp()">Envoyer le message</button>
      </div>

      <div style="text-align:center;">
        <a href="produits.html" class="back"><i class="fa-solid fa-arrow-left"></i> Retour aux produits</a>
      </div>

    </div>
  </div>

  <div class="footer">
    © 2026 DPSTORE — Tous droits réservés
  </div>

  <script>
    function sendHelp() {
      const message = document.getElementById("helpMessage").value.trim();
      if (!message) {
        alert("Merci d’écrire un message avant d’envoyer.");
        return;
      }
      const mailto =
        "mailto:christopherantoine773@gmail.com?subject=Assistance%20DPSTORE&body=" +
        encodeURIComponent(message);
      window.location.href = mailto;
    }
  </script>
</body>
</html>
