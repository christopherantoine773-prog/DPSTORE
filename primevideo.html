<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPSTORE | Prime Video</title>

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at center, #02010a 0%, #000014 100%);
    color: #fff;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 25px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    background: linear-gradient(90deg, #00aaff, #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.3rem;
    letter-spacing: 1px;
  }

  .back-btn {
    color: #FFD700;
    text-decoration: none;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.1);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #FFD700;
    transition: 0.3s;
  }

  .balance-box {
    background: rgba(0,255,150,0.1);
    border: 1px solid #00ffb3;
    padding: 5px 12px;
    border-radius: 12px;
    font-weight: bold;
    color: #00ffb3;
    margin-right: 10px;
  }

  .cart-btn {
    background: rgba(255,255,255,0.1);
    padding: 7px 14px;
    border-radius: 10px;
    border: 1px solid #00aaff;
    cursor: pointer;
    color: #00aaff;
    font-weight: bold;
  }

  .title {
    text-align: center;
    margin-top: 60px;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #00aaff, #00f7ff, #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
    padding: 40px;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 247, 255, 0.3);
    border-radius: 15px;
    padding: 25px;
    text-align: center;
  }

  .status {
    background: #00FF85;
    color: #000;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 0.8em;
  }

  .price {
    color: #FFD700;
    font-weight: bold;
  }

  .btn-commander {
    margin-top: 10px;
    background: linear-gradient(90deg, #00f7ff, #00aaff);
    color: #000;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>
  <a href="produits.html" class="back-btn">← Retour</a>

  <h1>DPSTORE — Prime Video</h1>

  <div style="display:flex; align-items:center;">
    <div class="balance-box" id="balanceBox">0 G</div>
    <button class="cart-btn" onclick="gotoCart()">🛒 Panier</button>
  </div>
</header>

<h2 class="title">PRIMEVIDEO</h2>

<section class="products" id="productGrid"></section>

<script>
/* 🔹 Vérification utilisateur */
let user = JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
if(!user.email){
  alert("Aucun compte connecté !");
  window.location.href = "index.html";
}

if(user.balance === undefined) user.balance = 0;

/* 🔹 Produits Prime Video dynamiques */
const PRODUCTS = [
  {name:"Prime Video 1 Mois", price:600},
  {name:"Prime Video 3 Mois", price:1620},
  {name:"Prime Video 6 Mois", price:3240}
];

/* 🔹 Générer les cartes produits */
const grid = document.getElementById("productGrid");
function renderProducts(){
  grid.innerHTML = "";
  PRODUCTS.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${p.name}</h3>
      <span class="status">Disponible</span>
      <p class="price">${p.price} G</p>
      <button class="btn-commander" onclick="addToCart('${p.name}', ${p.price})">Commander</button>
    `;
    grid.appendChild(card);
  });
}
renderProducts();

/* 🔹 Fonctions panier & solde */
function normalizeId(str){ return (str||"guest").toLowerCase().replace(/[^a-z0-9@.-]/g,"_").replace(/@/g,"_at_"); }
function getCartKey(){ return "cart_" + normalizeId(user.email); }
function loadCart(){ return JSON.parse(localStorage.getItem(getCartKey())||"[]"); }
function saveCart(cart){ localStorage.setItem(getCartKey(), JSON.stringify(cart)); }

function updateBalanceUI(){ 
  document.getElementById("balanceBox").textContent = user.balance + " G";
}

/* 🔹 Aller au panier */
function gotoCart(){ window.location.href = "cart.html"; }

/* 🔹 Ajouter au panier & créer reçu */
function addToCart(name, price){
  if(user.balance < price){
    alert("⚠ Solde insuffisant !");
    return;
  }

  let cart = loadCart();
  cart.push({name, price});
  saveCart(cart);

  // Déduire du solde
  user.balance -= price;
  if(user.balance < 0) user.balance = 0;
  sessionStorage.setItem("dpstore_user", JSON.stringify(user));
  updateBalanceUI();

  // Créer reçu pour receipts.html
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");
  orders.push({
    id: "order_" + Date.now(),
    buyer: user.email || "guest",
    name,
    price,
    date: new Date().toLocaleString(),
    status: "Validé"
  });
  localStorage.setItem("orders", JSON.stringify(orders));

  alert("✅ " + name + " ajouté au panier et reçu créé !");
}

updateBalanceUI();
</script>

</body>
</html>
