<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Creator Space — DPSTORE</title>

<style>
body{
    background:black;
    color:white;
    font-family:Arial;
    padding:20px;
    display:block;
    text-align:center;
}

/* ====== BOX ====== */
.box{
    background:#111;
    padding:20px;
    border-radius:15px;
    width:95%;
    margin:auto;
    margin-bottom:20px;
    box-shadow:0 0 20px #00eaff;
}

/* ====== INPUTS / BUTTONS ====== */
input, button, select{
    width:95%;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    background:#1c1c1c;
    color:white;
}
button{
    font-weight:bold;
    cursor:pointer;
}

/* ===== BUTTON STYLES ===== */
.btnBlue{ background:#00eaff; color:black; }
.btnOrange{ background:#ffaa00; color:black; }
.btnRed{ background:#ff3b3b; color:white; }
.btnGreen{ background:#00ff88; color:black; }
.btnYellow{ background:#ffb300; color:black; }

/* ===== TITRES ====== */
h2, h3{
    color:#00eaff;
    text-align:center;
}

/* ====== REQUEST (recharges) ====== */
.request{
    background:#1a1a1a;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
    text-align:left;
    border:1px solid #00eaff33;
}
.btnRow{
    display:flex;
    gap:10px;
    margin-top:10px;
}
.status{
    font-weight:bold;
    padding:3px 8px;
    border-radius:5px;
}
.status.pending{background:#555;}
.status.validated{background:#00ff88;color:black;}
.status.refused{background:#ff4444;}

/* ===== MENU STYLE ===== */
.selectorBox{
    width:95%;
    background:#007bff;
    padding:15px;
    border-radius:14px;
    margin:auto;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:18px;
    cursor:pointer;
    margin-bottom:10px;
    box-shadow:0 0 12px #007bff;
}
.selectorBox img{ width:30px; margin-right:10px; }
.optionList{
    width:95%;
    background:#004ea3;
    border-radius:12px;
    margin:auto;
    margin-bottom:15px;
    display:none;
    overflow:hidden;
    box-shadow:0 0 12px #004ea3;
}
.optionItem{
    padding:12px 15px;
    border-bottom:1px solid rgba(255,255,255,0.15);
    cursor:pointer;
}
.optionItem:hover{ background:#0060cc; }
.infoNote{
    background:#0b2b2b;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
    color:#9fe7ff;
}
</style>
</head>
<body>

<h2>🚀 MODE CREATOR / ADMIN</h2>
<p class="infoNote" id="infoNote">ℹ️ Données en cours de chargement...</p>

<!-- AJOUTER / RETIRER FONDS -->
<div class="box">
    <h3 id="fundTitle">💰 Ajouter des fonds</h3>
    <input id="dpInput" placeholder="DP ID (ex : DP-123456)">
    <input id="amountInput" type="number" placeholder="Montant">
    <select id="actionType">
        <option value="add">Ajouter</option>
        <option value="remove">Retirer</option>
    </select>
    <button id="fundBtn" class="btnBlue" onclick="processFunds()">✔️ Appliquer</button>
</div>

<!-- VERIFIER SOLDE -->
<div class="box">
    <h3>🔍 Vérifier le solde</h3>
    <input id="dpCheck" placeholder="DP ID, Email ou Nom">
    <button class="btnBlue" onclick="checkBalance()">🔎 Vérifier</button>
    <p id="checkResult" style="margin-top:10px; font-size:18px;"></p>
</div>

<!-- DEMANDES DE RECHARGE -->
<div class="box">
    <h3>📨 Demandes de recharge</h3>
    <div id="rechargeList"></div>
</div>

<!-- BOUTONS NAVIGATION -->
<button class="btnOrange" onclick="location.href='dp.html'">DP</button>
<button class="btnRed" onclick="location.href='profil.html'">⬅️ Retour au profil</button>
<button class="btnBlue" onclick="location.href='Archi.html'">📁 Archives</button>
<button class="btnGreen" onclick="location.href='tmm.html'">📦 TMM</button>

<button class="btnYellow" onclick="location.href='admin.html'">⚡ Panneau Admin</button>

<!-- AUDIO -->
<audio id="soundValidate" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b8ad29dbb.mp3?filename=correct-2-46134.mp3"></audio>
<audio id="soundRefuse" src="https://cdn.pixabay.com/download/audio/2021/09/09/audio_9d6f5bf86d.mp3?filename=error-126627.mp3"></audio>

<script type="module">

/* ======= PROTECTION SESSION ======= */
const account = JSON.parse(sessionStorage.getItem("dpstore_user"));
if(!account || !["employee","creator"].includes(account.role)){
    alert("⚠ Accès refusé ! Seuls les employés et créateurs peuvent accéder à cet espace.");
    location.href="profil.html";
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
  authDomain: "dpstore-officie.firebaseapp.com",
  projectId: "dpstore-officie",
  storageBucket: "dpstore-officie.appspot.com",
  messagingSenderId: "903943973062",
  appId: "1:903943973062:web:6501a2ec167adb31258fc7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allUsers = [];
let allRecharges = [];
let currentAction="add";

async function loadUsersFromFirestore(){
    const snapshot = await getDocs(collection(db, "users"));
    allUsers = snapshot.docs.map(d=>({id:d.id, data:d.data()}));
    showInfoNote(`✔ ${allUsers.length} utilisateurs chargés depuis Firestore`);
}
function findUserByDP(dpID){ return allUsers.find(u => (u.data.dp||"").toLowerCase()===dpID.toLowerCase() || (u.data.email||"").toLowerCase()===dpID.toLowerCase() )||null; }

async function processFunds(){
    const dp = document.getElementById("dpInput").value.trim();
    const amount = parseFloat(document.getElementById("amountInput").value);
    if(!dp || isNaN(amount) || amount<=0){ alert("DP ou montant invalide"); return; }
    const user = findUserByDP(dp);
    if(!user){ alert("DP introuvable"); return; }
    const newBalance = currentAction==="add" ? (parseFloat(user.data.balance)||0)+amount : Math.max(0,(parseFloat(user.data.balance)||0)-amount);
    await updateDoc(doc(db,"users",user.id), { balance:newBalance });
    alert(`✅ Solde mis à jour : ${newBalance}`);
    loadUsersFromFirestore();
    document.getElementById("checkResult").innerText = `Solde actuel : ${newBalance}`;
    playValidateSound();
}
async function checkBalance(){
    const dp = document.getElementById("dpCheck").value.trim();
    const user = findUserByDP(dp);
    if(!user){ document.getElementById("checkResult").innerText="❌ DP introuvable"; playRefuseSound(); return; }
    document.getElementById("checkResult").innerText = `💰 Solde : ${user.data.balance ?? 0}`;
    playValidateSound();
}

function toggleMenu(){ document.getElementById("actionMenu").style.display = document.getElementById("actionMenu").style.display==="block"?"none":"block"; }
function selectAction(type){ currentAction=type; document.getElementById("fundTitle").innerText=type==="add"?"💰 Ajouter des fonds":"💸 Retirer des fonds"; document.getElementById("fundBtn").innerText=type==="add"?"Ajouter":"Retirer"; }

function showInfoNote(txt,error=false){ const n=document.getElementById("infoNote"); n.innerText=txt; n.style.background=error?"#3a0b0b":"#0b2b2b"; }
function playValidateSound(){ try{document.getElementById("soundValidate").play()}catch(e){} }
function playRefuseSound(){ try{document.getElementById("soundRefuse").play()}catch(e){} }

await loadUsersFromFirestore();

// rendre fonctions globales pour boutons inline
window.processFunds=processFunds;
window.checkBalance=checkBalance;
window.toggleMenu=toggleMenu;
window.selectAction=selectAction;

</script>
</body>
</html>
