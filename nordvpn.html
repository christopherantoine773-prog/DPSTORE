<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPSTORE | NordVPN</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00111f, #004e92);
      color: #fff;
    }

    header {
      background: rgba(0,0,0,0.75);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px #00cfff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.2rem;
      background: linear-gradient(90deg, #00CFFF, #AEEFFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .balance-box {
      background: rgba(0,255,150,0.1);
      border: 1px solid #00ffb3;
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: bold;
      color: #00ffb3;
      margin-right: 10px;
    }

    .btn-retour, .btn-cart {
      background: #00CFFF;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-retour:hover, .btn-cart:hover {
      background: #FFD700;
      color: #000;
    }

    .container {
      padding: 25px;
    }

    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 12px #00cfff44;
      transition: 0.3s;
    }

    .product-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px #00CFFF99;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .product-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, #004e92, #00CFFF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: #EFFFFF;
      box-shadow: inset 0 0 10px #fff, 0 0 10px #00CFFF;
      text-shadow: 0 0 10px #fff;
    }

    .product-text h3 {
      margin: 0;
      color: #00CFFF;
    }

    .badges {
      margin: 8px 0;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 5px;
    }

    .badge.green { background: #00C851; color: #fff; }
    .badge.gray { background: #999; color: #fff; }

    .price {
      font-weight: bold;
      font-size: 1rem;
      margin: 6px 0;
    }

    .buy-btn {
      background: #00CFFF;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #FFD700;
      color: #000;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(0,0,0,0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <button class="btn-retour" onclick="window.location.href='produits.html'">← Retour</button>
  <h1>DPSTORE — NordVPN</h1>
  <div style="display:flex; align-items:center;">
    <div class="balance-box" id="balanceBox">0 G</div>
    <button class="btn-cart" onclick="window.location.href='cart.html'">🛒 Panier</button>
  </div>
</header>

<div class="container" id="productContainer">
</div>

<footer>© 2025 DPSTORE — Tous droits réservés</footer>

<script>
/* ===================================================
   🔐 PROFIL SÉCURISÉ + PANIER PAR COMPTE
=================================================== */
function safeParse(str){ try{ return JSON.parse(str); }catch(e){ return null; } }

let user = safeParse(sessionStorage.getItem("dpstore_user")) || null;

if(!user || !user.email || !user.dp || !user.username){
  alert("⚠ Vous devez être connecté !");
  window.location.href = "index.html";
}

function normalizeId(str){
  return (str || "guest").toLowerCase().replace(/[^a-z0-9@.-]/g,"_").replace(/@/g,"_at_");
}

function getCartKey(){ return "cart_" + normalizeId(user.email); }

function loadCart(){ return safeParse(localStorage.getItem(getCartKey())) || []; }
function saveCart(arr){ localStorage.setItem(getCartKey(), JSON.stringify(arr)); }

function updateBalanceUI(){
  user = safeParse(sessionStorage.getItem("dpstore_user")) || user;
  document.getElementById("balanceBox").textContent = (user.balance ?? user.credits ?? 0) + " G";
}

/* ===================================================
   🔥 PRODUITS
=================================================== */
const products = [
  { name: "NORDVPN 1 MOIS", price: 420 },
  { name: "NORDVPN 2 MOIS", price: 720 },
  { name: "NORDVPN 3 MOIS", price: 1200 }
];

const container = document.getElementById("productContainer");

products.forEach(p=>{
  const card = document.createElement("div");
  card.className = "product-card";
  card.innerHTML = `
    <div class="product-info">
      <div class="product-logo">NV</div>
      <div class="product-text">
        <h3>${p.name}</h3>
        <div class="badges">
          <span class="badge green">Disponible</span>
          <span class="badge gray">NordVPN</span>
        </div>
        <div class="price">${p.price} HTG</div>
        <p>Livraison 0 à 3h ❄️</p>
      </div>
    </div>
    <button class="buy-btn">Acheter</button>
  `;
  card.querySelector("button").addEventListener("click", ()=>{
    ajouterAuPanier(p.name, p.price);
  });
  container.appendChild(card);
});

/* ===================================================
   🔥 AJOUT AU PANIER (Option B)
   - Débit seulement lors du paiement
   - Stocke buyer, date, status, meta (accountName)
=================================================== */
function ajouterAuPanier(name, price){
  user = safeParse(sessionStorage.getItem("dpstore_user")) || user;
  const cart = loadCart();
  const item = {
    name,
    price,
    buyer: user.email,
    date: new Date().toLocaleString(),
    status: "En attente",
    meta: { accountName: user.username }
  };
  cart.push(item);
  saveCart(cart);
  alert(`✅ ${name} ajouté au panier !`);
  updateBalanceUI();
}

/* ===================================================
   🔥 UI INIT
=================================================== */
updateBalanceUI();
setInterval(updateBalanceUI, 1500);

</script>

</body>
</html>
