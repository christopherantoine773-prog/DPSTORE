<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profil — DPSTORE</title>
  
  <!-- Ajout de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BASE */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: "Inter", sans-serif; 
    }
    
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f8fafc; 
      text-align: center; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* CONTENEUR PROFIL (Glassmorphism) */
    .profile-box { 
      width: 100%; 
      max-width: 450px; 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(10px);
      padding: 40px 30px; 
      border-radius: 16px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 15px rgba(56, 189, 248, 0.2); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
    }

    /* PHOTO DE PROFIL */
    .photo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }

    #profile-pic { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      border: 3px solid #38bdf8; 
      object-fit: cover; 
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* BADGE TIKTOK/VERIFIED */
    .tiktok-badge { 
      display: inline-flex; 
      justify-content: center; 
      align-items: center; 
      width: 20px; 
      height: 20px; 
      background: #38bdf8; 
      border-radius: 50%; 
      font-size: 12px; 
      color: #0f172a; 
      font-weight: bold; 
      margin-left: 8px; 
      vertical-align: middle;
    }

    /* TEXTES PROFIL */
    h2 {
      font-size: 1.6em;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    #dp-id {
      color: #38bdf8;
      font-size: 1em;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #94a3b8;
      font-size: 0.95em;
      margin-bottom: 8px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      border: 1px solid #334155;
    }

    .stat-box p {
      margin: 5px 0;
    }

    /* BOUTONS GENERAUX */
    button { 
      width: 100%;
      padding: 12px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px;
      margin-top: 12px; 
      transition: all 0.2s ease;
    }
    
    button:active { transform: translateY(0); }

    /* BOUTONS ACTIONS */
    #changePhotoBtn { 
      background: rgba(56, 189, 248, 0.1); 
      color: #38bdf8; 
      border: 1px solid #38bdf8;
      width: auto;
      padding: 8px 16px;
      font-size: 12px;
      margin-bottom: 15px;
    }
    
    #changePhotoBtn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    #savePhotoBtn { 
      background: linear-gradient(90deg, #10b981 0%, #34d399 100%); 
      color: white; 
      display: none; 
      width: auto;
      padding: 8px 16px;
      font-size: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .btn-primary {
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
      color: white;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #0369a1 0%, #0284c7 100%);
      transform: translateY(-2px);
    }

    /* BOUTONS ROLES */
    .creator-btn { 
      background: linear-gradient(90deg, #8b5cf6 0%, #a855f7 100%); 
      color: white; 
      display: none; 
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
    .creator-btn:hover { transform: translateY(-2px); }

    #employeeBtn {
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }

    /* BOUTON DÉCONNEXION */
    .red { 
      background: transparent; 
      color: #ef4444; 
      border: 1px solid #ef4444;
      margin-top: 25px;
    }
    .red:hover {
      background: rgba(239, 68, 68, 0.1);
    }
  </style>
</head>
<body>

<div class="profile-box">
    
    <div class="photo-container">
      <img id="profile-pic" src="" alt="Photo de profil">
    </div>
    
    <button id="changePhotoBtn">📸 Modifier</button>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <button id="savePhotoBtn">💾 Enregistrer l'image</button>

    <h2>
        <span id="name"></span>
        <span id="badge"></span>
    </h2>

    <h3 id="dp-id"></h3>
    <p id="email"></p>
    
    <div class="stat-box">
      <p>Rôle : <span id="role" style="color:#38bdf8; font-weight:bold;"></span></p>
      <p style="color:#fcd34d; font-size:16px; font-weight:bold; margin-top:10px;">
        💰 Solde : <span id="credits">0</span> crédits
      </p>
    </div>
    
    <p style="font-size: 12px; margin-bottom: 20px;">Dernière co : <span id="lastLogin" style="color:#cbd5e1;"></span></p>

    <button id="creatorModeBtn" class="creator-btn" onclick="location.href='creator-space.html'">🚀 MODE CREATOR / ADMIN</button>
    <button id="employeeBtn" class="creator-btn" onclick="location.href='employee.html'" id="employeeBtnStyle">🛠️ ESPACE EMPLOYÉ</button>

    <button class="btn-primary" onclick="location.href='produits.html'">⬅️ Retour aux produits</button>
    <button class="red" onclick="logout()">Déconnexion</button>
</div>

<!-- ==============================================
     LOGIQUE JS CORRIGÉE AVEC SYNCHRONISATION DU SOLDE
     ============================================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
  authDomain: "dpstore-officie.firebaseapp.com",
  projectId: "dpstore-officie",
  storageBucket: "dpstore-officie.appspot.com",
  messagingSenderId: "903943973062",
  appId: "1:903943973062:web:6501a2ec167adb31258fc7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let sessionAccount = JSON.parse(sessionStorage.getItem("dpstore_user") || "null");
if(!sessionAccount || !sessionAccount.email){
    alert("Aucun compte détecté !");
    location.href = "index.html";
}

// ======== Récupération Firestore correcte et synchro du solde ========
async function loadUser(){
    try{
        const usersSnap = await getDocs(collection(db,"users"));
        let account = sessionAccount;

        // Chercher le document qui correspond à l’email
        usersSnap.forEach(docSnap=>{
            const data = docSnap.data();
            if(data.email && data.email.toLowerCase() === sessionAccount.email.toLowerCase()){
                let firestoreBalance = Number(data.balance ?? data.credits ?? 0);
                let sessionBalance = Number(sessionAccount.balance ?? firestoreBalance);
                
                let finalBalance = firestoreBalance;
                // Si un achat local a baissé le solde dans la session, on le synchronise vers Firestore
                if(sessionAccount.balance !== undefined && sessionAccount.balance < firestoreBalance){
                    finalBalance = sessionAccount.balance;
                    setDoc(doc(db,"users",docSnap.id), { balance: finalBalance }, { merge:true });
                }

                account = {
                    email: data.email,
                    username: data.username ?? sessionAccount.username,
                    dp: data.dp ?? sessionAccount.dp ?? "—",
                    role: data.role ?? sessionAccount.role ?? "user",
                    credits: finalBalance,
                    balance: finalBalance,
                    photo: data.photo ?? sessionAccount.photo ?? null,
                    lastLogin: data.lastLogin ?? sessionAccount.lastLogin ?? "—",
                    createdAt: data.createdAt ?? "—",
                    employeeType: data.employeeType ?? sessionAccount.employeeType ?? null
                };
            }
        });

        sessionStorage.setItem("dpstore_user", JSON.stringify(account));

        // AFFICHAGE
        document.getElementById("name").textContent = account.username;
        document.getElementById("email").textContent = account.email;
        document.getElementById("dp-id").textContent = account.dp;
        document.getElementById("credits").textContent = account.balance;
        document.getElementById("lastLogin").textContent = account.lastLogin;

        if(["creator","employee","admin"].includes(account.role)){
            document.getElementById("badge").innerHTML = `<span class="tiktok-badge">✔</span>`;
        }

        document.getElementById("role").textContent =
            account.role === "creator" ? "Créateur" :
            account.role === "employee" ? "Employé" :
            account.role === "admin" ? "Administrateur" : "Utilisateur";

        if(["creator","admin"].includes(account.role)){
            document.getElementById("creatorModeBtn").style.display = "block";
        }
        if(account.role === "employee"){
            document.getElementById("employeeBtn").style.display = "block";
        }

        document.getElementById("profile-pic").src = account.photo || "https://via.placeholder.com/120";

    }catch(e){
        console.warn("Erreur Firestore:", e);
        alert("Erreur en récupérant les données. Recharge la page.");
    }
}
await loadUser();

// ===== Modifier photo =====
document.getElementById("changePhotoBtn").onclick = () => document.getElementById("photoInput").click();
document.getElementById("photoInput").onchange = e => {
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = evt => {
        document.getElementById("profile-pic").src = evt.target.result;
        document.getElementById("savePhotoBtn").style.display = "inline-block";
    };
    reader.readAsDataURL(file);
};

// ===== Sauvegarder photo =====
document.getElementById("savePhotoBtn").onclick = async() => {
    try{
        let account = JSON.parse(sessionStorage.getItem("dpstore_user"));
        const usersSnap = await getDocs(collection(db,"users"));
        let userDocId = null;

        usersSnap.forEach(docSnap=>{
            const data = docSnap.data();
            if(data.email && data.email.toLowerCase() === account.email.toLowerCase()){
                userDocId = docSnap.id;
            }
        });

        if(!userDocId){ alert("Utilisateur introuvable sur Firestore"); return; }

        await setDoc(doc(db,"users",userDocId), { photo: document.getElementById("profile-pic").src }, { merge:true });
        account.photo = document.getElementById("profile-pic").src;
        sessionStorage.setItem("dpstore_user", JSON.stringify(account));
        alert("Photo enregistrée !");
        document.getElementById("savePhotoBtn").style.display = "none";
    }catch(e){
        console.warn("Erreur sauvegarde photo:", e);
        alert("Erreur lors de l'enregistrement.");
    }
};

// ===== Déconnexion =====
function logout(){
    sessionStorage.removeItem("dpstore_user");
    location.href = "index.html";
}
window.logout = logout;
</script>

</body>
</html>
