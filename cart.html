  <button class="btn-clear" onclick="clearCart()">🗑️ Vider le panier</button>
  <button class="btn-support" onclick="window.location.href='contact.html'">📞 Support / Aide</button>
  <!-- CORRECTION : Remplacer "reçus.html" par "recus.html" -->
  <button class="btn-clear" onclick="window.location.href='recus.html'">🧾 Voir les reçus</button>
</div>

<footer>© 2025 DPSTORE — Tous droits réservés</footer>

<script>
/* ============================
   🔥 SOLDE LIÉ AU PROFIL
   ============================ */
function loadUser(){
  let u = JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
  if(!u.email){ 
    alert("Aucun compte connecté !"); 
    window.location.href = "index.html"; 
    // CORRECTION : On arrête le script pour éviter le spam d'alertes
    throw new Error("Redirection en cours, arrêt du script."); 
  }
  return u;
}

let user = loadUser();

function updateBalanceUI(){
  // Plus besoin de recharger loadUser() ici si on le gère bien globalement
  document.getElementById("balanceBox").textContent = (user.balance ?? 0) + " G";
}

/* ============================
   🔥 PANIER PAR COMPTE
   ============================ */
function normalizeId(str){
  if(!str) return "guest";
  return String(str).toLowerCase().trim().replace(/[^a-z0-9@.-]/g, "_").replace(/@/g,"_at_");
}

function getCartKey(){
  return "cart_" + (user.email ? normalizeId(user.email) : "guest");
}

function migrateGlobalCartIfNeeded(){
  const globalKey = "cart";
  const perUserKey = getCartKey();
  const global = localStorage.getItem(globalKey);
  const perUser = localStorage.getItem(perUserKey);
  if(global && !perUser){
    localStorage.setItem(perUserKey, global);
    localStorage.removeItem(globalKey);
  }
}

function loadCart(){
  migrateGlobalCartIfNeeded();
  const key = getCartKey();
  return JSON.parse(localStorage.getItem(key) || "[]");
}

function saveCart(arr){
  const key = getCartKey();
  localStorage.setItem(key, JSON.stringify(arr));
}

/* ============================
   🔥 AFFICHAGE DU PANIER
   ============================ */
const container = document.getElementById("cart-items");
const totalEl = document.getElementById("total");

function renderCart(){
  const cart = loadCart();
  container.innerHTML = "";

  if(!cart || cart.length === 0){
    container.innerHTML = "<p style='text-align:center; opacity:0.7;'>🛍️ Aucun produit dans le panier.</p>";
    totalEl.textContent = "";
    updateBalanceUI();
    return;
  }

  let total = 0;
  cart.forEach((item, index) => {
    // CORRECTION : Forcer la conversion en nombre pour éviter la concaténation de texte (ex: "0100")
    let price = parseFloat(item.price) || 0;
    total += price;
    
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <span>${item.name} — <strong>${price} G</strong></span>
      <button class="btn-confirm" onclick="confirmSingle(${index})">✔</button>
    `;
    container.appendChild(div);
  });

  totalEl.textContent = "Total : " + total + " G";
  updateBalanceUI();
}

function confirmSingle(index){
  let cart = loadCart();
  const item = cart[index];
  if(!item) return alert("Article introuvable");

  let itemPrice = parseFloat(item.price) || 0;
  let currentBalance = parseFloat(user.balance) || 0;

  // CORRECTION : Comparaison sécurisée avec des nombres
  if(currentBalance < itemPrice){
    return alert("❌ Solde insuffisant !");
  }

  // Déduction
  user.balance = currentBalance - itemPrice;
  sessionStorage.setItem("dpstore_user", JSON.stringify(user));

  // Mise à jour de la base de données globale des comptes
  let accounts = JSON.parse(localStorage.getItem("dpstore_accounts") || "[]");
  let acc = accounts.find(a => a.email.toLowerCase() === user.email.toLowerCase());
  if(acc){ 
    acc.balance = user.balance; 
    localStorage.setItem("dpstore_accounts", JSON.stringify(accounts)); 
  }

  // Enregistrement de la commande
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  orders.push({
    name: item.name,
    price: itemPrice,
    buyer: user.email,
    date: new Date().toLocaleString()
  });
  localStorage.setItem("orders", JSON.stringify(orders));

  // Suppression de l'article du panier
  cart.splice(index, 1);
  saveCart(cart);
  
  // Re-rendu de l'interface
  renderCart();
  alert("✅ Commande confirmée !");
}

function clearCart(){
  const key = getCartKey();
  localStorage.removeItem(key);
  renderCart();
}

function goBack(){ 
  window.location.href = localStorage.getItem("lastPage") || "produits.html"; 
}

// Initialisation au chargement de la page
renderCart();
</script>
</body>
</html>
