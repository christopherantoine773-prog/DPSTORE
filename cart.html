<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recharge — DPSTORE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome pour les logos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* --- BASE --- */
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f8fafc;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- HEADER --- */
  .header {
    padding: 15px 25px;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header a {
    color: #38bdf8;
    font-weight: 600;
    text-decoration: none;
    font-size: 1rem;
    transition: 0.2s;
  }
  .header a:hover {
    color: #0ea5e9;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
  }

  /* --- CONTAINER & CARD --- */
  .container {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .card {
    background: rgba(30, 41, 59, 0.6);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid #334155;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
  }
  .card h2 {
    color: #38bdf8;
    font-size: 1.5rem;
    margin: 0 0 15px;
    font-weight: 700;
  }

  /* --- INFO PAIEMENT --- */
  .payment-info {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    color: #e2e8f0;
    line-height: 1.5;
    text-align: center;
  }
  .payment-info b {
    color: #38bdf8;
  }

  /* --- BOUTONS DE CONTACT (ADMIN) --- */
  .admin-contacts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    color: #fff !important;
    transition: 0.2s;
  }
  .contact-btn.discord { background: #5865F2; }
  .contact-btn.whatsapp { background: #25D366; }
  .contact-btn.email { background: #ea4335; }
  .contact-btn:hover {
    opacity: 0.9;
    transform: scale(1.03);
  }

  #balanceDisplay {
    color: #fcd34d;
    font-weight: 700;
    font-size: 1.15rem;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #334155;
  }

  /* --- FORMULAIRE --- */
  label.small {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-top: 15px;
    margin-bottom: 5px;
    display: block;
    font-weight: 500;
  }
  
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f8fafc;
    font-family: inherit;
    font-size: 1rem;
    transition: 0.3s;
  }
  input:focus, select:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    outline: none;
  }
  input[readonly] {
    opacity: 0.7;
    color: #38bdf8;
    font-weight: 600;
    background: rgba(15, 23, 42, 0.5);
    cursor: not-allowed;
  }

  .hidden {
    display: none !important;
  }

  /* --- BOUTONS --- */
  button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border-radius: 10px;
    background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
    color: white;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
  }
  button:hover:not([disabled]) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
  }
  button[disabled] {
    background: #334155;
    box-shadow: none;
    color: #94a3b8;
    cursor: not-allowed;
    transform: none;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(56, 189, 248, 0.5);
    box-shadow: none;
    color: #38bdf8;
    margin-top: 15px;
  }
  .btn-secondary:hover {
    background: rgba(56, 189, 248, 0.1);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
  }

  /* --- ERREURS & POPUP --- */
  .error {
    color: #fca5a5;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    display: none;
    font-size: 0.9rem;
  }

  .popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
    z-index: 100;
  }
  .popup.active {
    opacity: 1;
    visibility: visible;
  }
  .popup-content {
    background: #1e293b;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid #334155;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .popup h2 {
    color: #38bdf8;
    margin: 0 0 10px;
    font-size: 1.8rem;
  }
  .popup p {
    color: #e2e8f0;
    margin: 0;
  }
</style>
</head>
<body>

<audio id="soundOK" src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAA…" preload="auto"></audio>

<header class="header">
  <a href="profil.html"><i class="fa-solid fa-arrow-left"></i> Retour au Profil</a>
</header>

<div class="container">
  <div class="card">
    <h2><i class="fa-solid fa-wallet"></i> Recharger mon compte</h2>
    
    <div class="payment-info" id="paymentInfo">
      Recharge via <b id="methodTitle">Natcash</b><br>
      Compte à créditer : <b>Christopher Antoine — 42758154</b>
    </div>
    
    <p id="balanceDisplay">💰 Solde actuel : ... G</p>

    <form id="payForm" novalidate>

      <label class="small">Méthode de paiement *</label>
      <select id="methodInput" required>
        <option value="Natcash">Natcash</option>
        <option value="PayPal">PayPal</option>
        <option value="Autre">Autre méthode...</option>
      </select>

      <label class="small">Nom complet *</label>
      <input id="nameInput" required>

      <label class="small">Email *</label>
      <input id="emailInput" type="email" required>

      <label class="small">DP-ID *</label>
      <input id="dpInput" readonly>

      <label class="small" id="labelPhone">Numéro de téléphone (optionnel)</label>
      <input id="phoneInput">

      <label class="small">Montant désiré *</label>
      <input id="amountInput" type="number" placeholder="Ex: 500" required>

      <div id="transcodeContainer">
        <label class="small" id="labelTranscode">Transcode Natcash *</label>
        <input id="transcodeInput" placeholder="Saisir la référence de la transaction" required>
      </div>

      <div id="errorBox" class="error"></div>

      <button id="sendBtn" type="submit"><i class="fa-solid fa-paper-plane"></i> Envoyer la demande</button>
      <button type="button" class="btn-secondary" onclick="location.href='trx.html'"><i class="fa-solid fa-file-lines"></i> Voir l'historique</button>

    </form>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2>✅ Demande envoyée !</h2>
    <p>Ta recharge est en cours de vérification.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
  authDomain: "dpstore-officie.firebaseapp.com",
  projectId: "dpstore-officie",
  storageBucket: "dpstore-officie.appspot.com",
  messagingSenderId: "903943973062",
  appId: "1:903943973062:web:6501a2ec167adb31258fc7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔐 PROFIL CONNECTÉ */
let user = JSON.parse(sessionStorage.getItem("dpstore_user") || "null");
if(!user || !user.email || !user.dp){
    alert("⚠️ Accès refusé : vous devez être connecté.");
    location.href = "index.html";
}

document.getElementById("nameInput").value  = user.username || "";
document.getElementById("emailInput").value = user.email;
document.getElementById("dpInput").value    = user.dp;

async function loadBalance(){
    try{
        const usersSnap = await getDocs(collection(db,"users"));
        let account = user;
        usersSnap.forEach(docSnap=>{
            const data = docSnap.data();
            if(data.email && data.email.toLowerCase() === user.email.toLowerCase()){
                account = {...account, balance: Number(data.balance ?? data.credits ?? 0)};
            }
        });
        user.balance = account.balance;
        sessionStorage.setItem("dpstore_user", JSON.stringify(user));
        document.getElementById("balanceDisplay").textContent = `💰 Solde actuel : ${user.balance} G`;
    }catch(e){
        console.warn("Erreur Firestore:", e);
        document.getElementById("balanceDisplay").textContent = "💰 Solde actuel : —";
    }
}
await loadBalance();

/* ==================================================
   🔥 GESTION DES METHODES (INDISPONIBLES SAUF NATCASH)
   ================================================== */
const methodInput = document.getElementById("methodInput");
const paymentInfo = document.getElementById("paymentInfo");
const transcodeContainer = document.getElementById("transcodeContainer");
const transcodeInput = document.getElementById("transcodeInput");
const sendBtn = document.getElementById("sendBtn");

methodInput.addEventListener("change", function() {
  if (this.value === "Natcash") {
    paymentInfo.innerHTML = `Recharge via <b>Natcash</b><br>Compte à créditer : <b>Christopher Antoine — 42758154</b>`;
    transcodeContainer.style.display = "block";
    transcodeInput.required = true;
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";
  } else {
    // Si PayPal ou Autre
    paymentInfo.innerHTML = `⚠️ Cette méthode est <b>indisponible pour le moment</b>.<br>Si vous souhaitez recharger votre compte, contactez directement l'admin :
      <div class="admin-contacts">
        <a href="https://discord.com/channels/1480426047186141266/1536904547132244079" target="_blank" class="contact-btn discord"><i class="fa-brands fa-discord"></i> Discord</a>
        <a href="https://wa.me/13478575829" target="_blank" class="contact-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
        <a href="mailto:christopherantoine773@gmail.com" class="contact-btn email"><i class="fa-solid fa-envelope"></i> Email</a>
      </div>`;
    transcodeContainer.style.display = "none";
    transcodeInput.required = false;
    sendBtn.disabled = true;
    sendBtn.style.opacity = "0.5";
  }
});

function normalizeId(str){
  return str.toLowerCase().replace(/[^a-z0-9@.-]/g,"_").replace(/@/g,"_at_");
}
const key = "dp_recharges_" + normalizeId(user.email);

const popup = document.getElementById("popup");
const errorBox = document.getElementById("errorBox");
const soundOK = document.getElementById("soundOK");

function showError(t){
  errorBox.textContent = t;
  errorBox.style.display = "block";
  setTimeout(()=> errorBox.style.display="none", 4000);
}

document.getElementById("payForm").addEventListener("submit", e => {
  e.preventDefault();

  const method = methodInput.value;
  if (method !== "Natcash") {
    return showError("Veuillez utiliser Natcash ou contacter l'admin directement.");
  }

  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const amount = document.getElementById("amountInput").value.trim();
  const transcode = transcodeInput.value.trim();

  if(!name) return showError("Le nom est obligatoire.");
  if(!email) return showError("L'email est obligatoire.");
  if(!amount || amount <= 0) return showError("Veuillez entrer un montant valide.");
  if(!transcode) return showError("Veuillez entrer le transcode Natcash.");

  sendBtn.disabled = true;
  sendBtn.textContent = "Envoi en cours...";

  let list = JSON.parse(localStorage.getItem(key) || "[]");

  const newEntry = {
    method: method,
    name: name,
    email: email,
    phone: document.getElementById("phoneInput").value.trim(),
    amount: amount,
    transcode: transcode,
    dpID: user.dp, 
    emailAccount: user.email,
    status: "en attente",
    created: new Date().toLocaleString()
  };

  list.unshift(newEntry);
  localStorage.setItem(key, JSON.stringify(list));

  window.dispatchEvent(new StorageEvent('storage', { key, newValue: JSON.stringify(list) }));

  try { soundOK.play(); } catch(e) {}
  
  popup.classList.add("active");

  setTimeout(() => location.reload(), 2000);
});
</script>

</body>
</html>
