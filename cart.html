<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPSTORE | Panier</title>

<style>
  body { font-family: 'Poppins', sans-serif; background: linear-gradient(160deg, #000, #021220, #001a13); margin: 0; color: #e0ffe9; overflow-x: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(0, 20, 10, 0.55); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,255,150,0.15); box-shadow: 0 0 25px rgba(0,255,150,0.15); position: sticky; top: 0; z-index: 20; }
  header h1 { font-size: 1.5rem; font-weight: 700; color: #00ffb3; letter-spacing: 1px; }
  .balance { background: rgba(0,255,150,0.12); border: 1px solid rgba(0,255,150,0.4); padding: 8px 15px; border-radius: 25px; font-weight: 600; color: #00ffb3; font-size: 1rem; box-shadow: 0 0 10px rgba(0,255,150,0.3); }
  .back-btn { background: transparent; border: 2px solid #00ffb3; color: #00ffb3; padding: 6px 16px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.25s; }
  .back-btn:hover { background: #00ffb3; color: #000; transform: scale(1.05); }
  .container { padding: 35px 20px; max-width: 800px; margin: auto; }
  .item { background: rgba(0,255,179,0.06); border: 1px solid rgba(0,255,179,0.25); border-radius: 16px; margin-bottom: 18px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 20px rgba(0,255,179,0.12); backdrop-filter: blur(10px); }
  .btn-confirm { background: linear-gradient(90deg, #00ffb3, #00e676); border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; color: #000; transition: 0.2s; box-shadow: 0 0 10px rgba(0,255,179,0.4); }
  .btn-confirm:hover { transform: scale(1.1); }
  .total { text-align: right; font-weight: bold; font-size: 1.3rem; color: #00ffb3; margin-top: 25px; padding: 10px; border-top: 1px solid rgba(0,255,150,0.3); }
  .btn-clear, .btn-support { width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 700; border: none; transition: 0.25s; margin-top: 18px; }
  .btn-clear { background: linear-gradient(90deg, #00ffb3, #00695c); color: #000; }
  .btn-support { background: linear-gradient(90deg, #00b4ff, #0060ff); color: #000; }
</style>
</head>

<body>

<header>
  <button class="back-btn" onclick="goBack()">← Retour</button>
  <h1>DPSTORE 🛒</h1>
  <div class="balance" id="balanceBox">0 G</div>
</header>

<div class="container">
  <div id="cart-items"></div>
  <div id="total" class="total"></div>
  <button class="btn-clear" onclick="clearCart()">🗑️ Vider le panier</button>
  <button class="btn-support" onclick="window.location.href='contact.html'">📞 Support / Aide</button>
  <button class="btn-clear" onclick="window.location.href='reçus.html'">🧾 Voir les reçus</button>
</div>

<script>
function loadUser(){
  return JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
}

function updateBalanceUI(){
  const user = loadUser();
  document.getElementById("balanceBox").textContent = (user.balance ?? 0) + " G";
}

function normalizeId(str){ return !str ? "guest" : String(str).toLowerCase().trim().replace(/[^a-z0-9@.-]/g, "_"); }
function getCartKey(){ return "cart_" + normalizeId(loadUser().email); }
function loadCart(){ return JSON.parse(localStorage.getItem(getCartKey()) || "[]"); }
function saveCart(arr){ localStorage.setItem(getCartKey(), JSON.stringify(arr)); }

function renderCart(){
  const cart = loadCart();
  container.innerHTML = "";
  if(cart.length === 0){
    container.innerHTML = "<p style='text-align:center; opacity:0.7;'>🛍️ Aucun produit.</p>";
    totalEl.textContent = "";
  } else {
    let total = 0;
    cart.forEach((item,index)=>{
      total += item.price || 0;
      const div = document.createElement("div");
      div.className="item";
      div.innerHTML = `<span>${item.name} — <strong>${item.price} G</strong></span><button class="btn-confirm" onclick="confirmSingle(${index})">✔</button>`;
      container.appendChild(div);
    });
    totalEl.textContent = "Total : "+total+" G";
  }
  updateBalanceUI();
}

function confirmSingle(index){
  let user = loadUser();
  let cart = loadCart();
  const item = cart[index];
  
  if(!user.email) return alert("Erreur session");
  if((user.balance ?? 0) < (item.price ?? 0)) return alert("❌ Solde insuffisant !");

  // 1. Calcul et Mise à jour locale
  user.balance -= item.price;
  sessionStorage.setItem("dpstore_user", JSON.stringify(user));

  // 2. Mise à jour de la base de données persistante (le vrai bug venait d'ici)
  let accounts = JSON.parse(localStorage.getItem("dpstore_accounts") || "[]");
  let accIndex = accounts.findIndex(a => a.email.toLowerCase() === user.email.toLowerCase());
  if(accIndex !== -1){
    accounts[accIndex].balance = user.balance;
    localStorage.setItem("dpstore_accounts", JSON.stringify(accounts));
  }

  // 3. Enregistrement commande
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  orders.push({name:item.name, price:item.price, buyer:user.email, date:new Date().toLocaleString()});
  localStorage.setItem("orders", JSON.stringify(orders));

  // 4. Finalisation
  cart.splice(index,1);
  saveCart(cart);
  renderCart();
  alert("✅ Commande confirmée !");
}

function clearCart(){ localStorage.removeItem(getCartKey()); renderCart(); }
function goBack(){ window.history.back(); }

const container = document.getElementById("cart-items");
const totalEl = document.getElementById("total");
renderCart();
</script>

</body>
</html>
