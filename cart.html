<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPSTORE | Panier</title>
<style>
  body { font-family: 'Poppins', sans-serif; background: linear-gradient(160deg, #000, #021220, #001a13); margin: 0; color: #e0ffe9; overflow-x: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(0, 20, 10, 0.55); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,255,150,0.15); position: sticky; top: 0; z-index: 20; }
  header h1 { font-size: 1.5rem; font-weight: 700; color: #00ffb3; }
  .balance { background: rgba(0,255,150,0.12); border: 1px solid rgba(0,255,150,0.4); padding: 8px 15px; border-radius: 25px; font-weight: 600; color: #00ffb3; }
  .container { padding: 35px 20px; max-width: 800px; margin: auto; }
  .item { background: rgba(0,255,179,0.06); border: 1px solid rgba(0,255,179,0.25); border-radius: 16px; margin-bottom: 18px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
  .btn-confirm { background: linear-gradient(90deg, #00ffb3, #00e676); border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; color: #000; }
  .total { text-align: right; font-weight: bold; font-size: 1.3rem; color: #00ffb3; margin-top: 25px; }
  .btn-clear { width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 700; border: none; margin-top: 18px; background: linear-gradient(90deg, #00ffb3, #00695c); color: #000; }
</style>
</head>

<body>

<header>
  <button onclick="window.location.href='produits.html'" style="background:transparent; border:1px solid #00ffb3; color:#00ffb3; padding:5px 10px; border-radius:10px; cursor:pointer;">← Retour</button>
  <h1>DPSTORE 🛒</h1>
  <div class="balance" id="balanceBox">Chargement...</div>
</header>

<div class="container">
  <div id="cart-items"></div>
  <div id="total" class="total"></div>
  <button class="btn-clear" onclick="clearCart()">🗑️ Vider le panier</button>
</div>

<script>
// 1. Chargement utilisateur
function getUser(){
  return JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
}

function updateUI(){
  const user = getUser();
  document.getElementById("balanceBox").textContent = (user.balance ?? 0) + " G";
  renderCart();
}

// 2. Gestion Panier
function getCartKey(){
  const user = getUser();
  return "cart_" + (user.email ? user.email.toLowerCase().replace(/[^a-z0-9]/g, "_") : "guest");
}

function loadCart(){
  return JSON.parse(localStorage.getItem(getCartKey()) || "[]");
}

function renderCart(){
  const cart = loadCart();
  const container = document.getElementById("cart-items");
  const totalEl = document.getElementById("total");
  container.innerHTML = "";
  
  if(cart.length === 0){
    container.innerHTML = "<p style='text-align:center;'>🛍️ Panier vide.</p>";
    totalEl.textContent = "";
    return;
  }

  let total = 0;
  cart.forEach((item, index) => {
    total += item.price;
    container.innerHTML += `
      <div class="item">
        <span>${item.name} — <b>${item.price} G</b></span>
        <button class="btn-confirm" onclick="confirmPurchase(${index})">Payer</button>
      </div>`;
  });
  totalEl.textContent = "Total : " + total + " G";
}

// 3. Confirmation corrigée
function confirmPurchase(index){
  let user = getUser();
  let cart = loadCart();
  const item = cart[index];

  if((user.balance ?? 0) < item.price){
    return alert("❌ Solde insuffisant !");
  }

  // Débit local immédiat
  user.balance -= item.price;
  sessionStorage.setItem("dpstore_user", JSON.stringify(user));

  // Mise à jour de la liste des comptes (persistance locale)
  let accounts = JSON.parse(localStorage.getItem("dpstore_accounts") || "[]");
  let accIndex = accounts.findIndex(a => a.email === user.email);
  if(accIndex !== -1){
    accounts[accIndex].balance = user.balance;
    localStorage.setItem("dpstore_accounts", JSON.stringify(accounts));
  }

  // Sauvegarde commande
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  orders.push({ ...item, date: new Date().toLocaleDateString() });
  localStorage.setItem("orders", JSON.stringify(orders));

  // Nettoyage panier
  cart.splice(index, 1);
  localStorage.setItem(getCartKey(), JSON.stringify(cart));

  alert("✅ Achat réussi !");
  
  // Refresh au lieu de redirection pour garder les données en session
  updateUI();
}

function clearCart(){
  localStorage.removeItem(getCartKey());
  renderCart();
}

// Initialisation
updateUI();
</script>

</body>
</html>
