<script>
/* ============================
   🔥 SOLDE LIÉ AU PROFIL
   ============================ */
function loadUser(){
  let u = JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
  if(!u.email){ alert("Aucun compte connecté !"); window.location.href="index.html"; }
  return u;
}

let user = loadUser();

function updateBalanceUI(){
  // On recharge les données depuis le session storage pour avoir le solde à jour
  user = loadUser();
  document.getElementById("balanceBox").textContent = (user.balance ?? 0) + " G";
}

/* ============================
   🔥 PANIER PAR COMPTE
   ============================ */
function normalizeId(str){
  if(!str) return "guest";
  return String(str).toLowerCase().trim().replace(/[^a-z0-9@.-]/g, "_").replace(/@/g,"_at_");
}

function getCartKey(){
  return "cart_" + (user.email ? normalizeId(user.email) : "guest");
}

function loadCart(){
  const key = getCartKey();
  return JSON.parse(localStorage.getItem(key) || "[]");
}

function saveCart(arr){
  const key = getCartKey();
  localStorage.setItem(key, JSON.stringify(arr));
}

/* ============================
   🔥 AFFICHAGE DU PANIER
   ============================ */
const container = document.getElementById("cart-items");
const totalEl = document.getElementById("total");

function renderCart(){
  const cart = loadCart();
  container.innerHTML = "";

  if(!cart || cart.length === 0){
    container.innerHTML = "<p style='text-align:center; opacity:0.7;'>🛍️ Aucun produit dans le panier.</p>";
    totalEl.textContent = "";
    return;
  }

  let total = 0;
  cart.forEach((item, index) => {
    total += item.price || 0;
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <span>${item.name} — <strong>${item.price} G</strong></span>
      <button class="btn-confirm" onclick="confirmSingle(${index})">✔</button>
    `;
    container.appendChild(div);
  });

  totalEl.textContent = "Total : " + total + " G";
}

function confirmSingle(index){
  // 1. Récupération des données fraîches
  let currentUser = loadUser();
  let cart = loadCart();
  const item = cart[index];
  
  if(!item) return alert("Article introuvable");

  // 2. Vérification solde
  if((currentUser.balance ?? 0) < (item.price ?? 0)){
    return alert("❌ Solde insuffisant !");
  }

  // 3. Mise à jour solde (Calcul local)
  currentUser.balance -= item.price;
  
  // 4. Sauvegarde dans Session (pour UI immédiate) et Local (pour persistence)
  sessionStorage.setItem("dpstore_user", JSON.stringify(currentUser));

  let accounts = JSON.parse(localStorage.getItem("dpstore_accounts") || "[]");
  let acc = accounts.find(a => a.email.toLowerCase() === currentUser.email.toLowerCase());
  if(acc){ 
    acc.balance = currentUser.balance; 
    localStorage.setItem("dpstore_accounts", JSON.stringify(accounts)); 
  }

  // 5. Enregistrement commande
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  orders.push({
    name: item.name,
    price: item.price,
    buyer: currentUser.email,
    date: new Date().toLocaleString()
  });
  localStorage.setItem("orders", JSON.stringify(orders));

  // 6. Suppression du produit du panier SANS recharger la page
  cart.splice(index, 1);
  saveCart(cart);
  
  // 7. Mise à jour de l'affichage
  renderCart();
  updateBalanceUI();
  
  alert("✅ Commande confirmée !");
}

function clearCart(){
  localStorage.removeItem(getCartKey());
  renderCart();
}

function goBack(){ window.location.href = localStorage.getItem("lastPage") || "produits.html"; }

// Initialisation
renderCart();
updateBalanceUI();
</script>
