<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DPSTORE | Nouveaux Produits</title>

<style>
body { margin:0; font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#000428,#004e92); color:#fff; }
header { backdrop-filter: blur(10px); background: rgba(0,0,0,0.45); padding: 14px 22px; display:flex; justify-content: space-between; align-items:center; border-bottom:1px solid rgba(0,174,239,0.4); box-shadow:0 0 12px rgba(0,174,239,0.35); position:sticky; top:0; z-index:50; }
header h1 { font-size:1.5rem; background: linear-gradient(90deg,#FFD700,#00ADEF); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:0; font-weight:700; }
.header-buttons { display:flex; align-items:center; gap:10px; }
.btn-header { padding:7px 12px; border-radius:10px; border:2px solid #00aaff; background:rgba(0,0,0,0.4); color:white; font-weight:600; cursor:pointer; transition:0.25s; }
.btn-header:hover { background:#00aaff; color:#000; box-shadow:0 0 12px #00aaff; }
#user-balance { padding:7px 14px; border-radius:10px; background:rgba(255,255,255,0.1); font-weight:bold; border:1px solid rgba(0,174,239,0.4); }
.container { padding:25px; }
.section-title { font-size:1.5rem; margin-bottom:20px; text-shadow:0 0 10px #FFD700; }
.product-box { background: rgba(255,255,255,0.06); padding:20px; border-radius:14px; border:1px solid rgba(255,255,255,0.12); margin-bottom:20px; box-shadow:0 0 15px rgba(0,174,239,0.35); }
.product-box h3 { color:#FFD700; }
.btn-cart { margin-top:12px; padding:10px; width:100%; border-radius:10px; border:none; background:#00ADEF; color:#000; font-weight:bold; cursor:pointer; transition:0.25s; }
.btn-cart:hover { background:#FFD700; box-shadow:0 0 12px #FFD700; }
.toast { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:#00aaff; color:#000; padding:10px 20px; border-radius:10px; font-weight:bold; opacity:0; transition:opacity 0.4s; }
.toast.show { opacity:1; }
</style>
</head>

<body>

<header>
  <h1>Nouveaux Produits</h1>
  <div class="header-buttons">
    <div id="user-balance">0 G</div>
    <button class="btn-header" onclick="goBack()">← Retour</button>
    <button class="btn-header" onclick="openProfile()">👤</button>
    <button class="btn-header" onclick="openCart()">🛒</button>
  </div>
</header>

<div class="container">
  <h2 class="section-title">🆕 Produits ajoutés récemment</h2>
  <div id="new-products"></div>
</div>

<div id="toast" class="toast">✅ Ajouté au panier</div>

<footer style="text-align:center;padding:20px;opacity:0.6;">
  © 2025 DPSTORE — Nouveaux Produits
</footer>

<script>
/* ============================
   🔥 PROFIL UTILISATEUR
============================ */
let user = JSON.parse(sessionStorage.getItem("dpstore_user") || "null");
if(!user || !user.email){
  alert("⚠️ Veuillez vous connecter !");
  window.location.href="index.html";
}
if(!user.balance) user.balance = 0;

/* ============================
   🔥 PANIER PAR COMPTE
============================ */
function normalizeId(str){ return (str||"guest").toLowerCase().replace(/[^a-z0-9@.-]/g,"_").replace(/@/g,"_at_"); }
function getCartKey(){ return "cart_"+normalizeId(user.email); }

function migrateGlobalCartIfNeeded(){
  const globalKey="cart";
  const perUserKey=getCartKey();
  if(localStorage.getItem(globalKey) && !localStorage.getItem(perUserKey)){
    localStorage.setItem(perUserKey, localStorage.getItem(globalKey));
    localStorage.removeItem(globalKey);
  }
}

function loadCart(){ migrateGlobalCartIfNeeded(); return JSON.parse(localStorage.getItem(getCartKey())||"[]"); }
function saveCart(arr){ localStorage.setItem(getCartKey(), JSON.stringify(arr)); }

/* ============================
   🔥 SOLDE
============================ */
function updateBalanceUI(){
  user = JSON.parse(sessionStorage.getItem("dpstore_user")||"{}");
  document.getElementById("user-balance").textContent = (user.balance||0) + " G";
}
updateBalanceUI();
setInterval(updateBalanceUI,1500);

/* ============================
   🔥 AJOUT AU PANIER
============================ */
function showToast(){ 
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

function addToCart(product){
  if(!product) return alert("Produit introuvable.");
  const cart = loadCart();
  cart.push({
    name: product.name || "Produit",
    price: Number(product.price) || 0,
    buyer: user.email,
    date: new Date().toLocaleString(),
    status: "En attente",
    meta: { accountName: user.username }
  });
  saveCart(cart);
  showToast();
}

/* ============================
   🔥 RENDER PRODUITS
============================ */
let products = JSON.parse(localStorage.getItem("dpr_products") || "[]");

function renderProducts(){
  const box=document.getElementById("new-products");
  box.innerHTML="";
  if(!products || products.length===0){
    box.innerHTML="<p style='opacity:0.6;'>Aucun nouveau produit.</p>";
    return;
  }
  products.forEach((p,idx)=>{
    if(!p.id) p.id="prod_"+(p.name||"x").toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"")+"_"+idx;
    const div=document.createElement("div");
    div.className="product-box";
    const imgHtml=p.img?`<img src="${p.img}" width="140" style="border-radius:10px;margin-top:10px;">`:"";
    div.innerHTML=`
      <h3>${p.name}</h3>
      <p>${p.desc||"Pas de description."}</p>
      <p><strong>Prix : ${p.price||0} HTG</strong></p>
      ${imgHtml}
    `;
    const btn=document.createElement("button");
    btn.className="btn-cart";
    btn.textContent="🛒 Ajouter au panier";
    btn.addEventListener("click",()=>addToCart(p));
    div.appendChild(btn);
    box.appendChild(div);
  });
}

renderProducts();

/* ============================
   🔥 NAVIGATION
============================ */
function openCart(){ window.location.href="cart.html"; }
function openProfile(){ window.location.href="profil.html"; }
function goBack(){ window.location.href="produits.html"; }

</script>
</body>
</html>
