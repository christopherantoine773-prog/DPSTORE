<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Creator Space — DPSTORE</title>
<style>
body{ background:black; color:white; font-family:Arial; padding:20px; }
.box{ background:#111; padding:20px; border-radius:15px; width:95%; margin:auto; margin-bottom:20px; box-shadow:0 0 10px #00eaff; }
input, button, select{ width:95%; margin-top:10px; padding:12px; border-radius:10px; border:none; font-size:16px; }
button{ background:#00eaff; color:black; font-weight:bold; cursor:pointer; }
h2{ color:#00eaff; text-align:center; }

/* Menu 3 points */
.menu-container { position: absolute; top: 10px; right: 20px; }
.dropbtn { background: #333; color: white; padding: 10px; cursor: pointer; border-radius: 5px; }
.dropdown-content { display: none; position: absolute; right: 0; background: #222; min-width: 160px; z-index: 1; border-radius: 10px; }
.dropdown-content a { color: white; padding: 12px; display: block; text-decoration: none; }
.dropdown-content a:hover { background: #444; }

.request{ background:#222; padding:12px; border-radius:10px; margin-top:15px; border-left:4px solid #00eaff; }
.btnRow{ display:flex; gap:10px; margin-top:10px; }
.btnGreen{ background:#00ff88; color:black; font-weight:bold; }
.btnRed{ background:#ff4444; color:white; font-weight:bold; }
.infoNote{ background:#0b2b2b; padding:10px; border-radius:8px; margin-top:8px; color:#9fe7ff; text-align:center; }
</style>
</head>
<body>

<!-- Menu 3 points -->
<div class="menu-container">
    <div class="dropbtn" onclick="document.getElementById('myDropdown').classList.toggle('show')">⋮</div>
    <div id="myDropdown" class="dropdown-content">
        <a href="profil.html">⬅️ Retour au profil</a>
        <a href="offon.html">⚡ Ouvrir OFF/ON</a>
        <a href="espace.html">🌐 Espace</a>
        <a href="tmm.html">📦 TMM</a>
    </div>
</div>

<h2>🚀 MODE CREATOR / ADMIN</h2>
<p class="infoNote" id="infoNote">ℹ️ Initialisation...</p>

<div class="box">
    <h3 id="fundTitle">💰 Gérer les fonds</h3>
    <input id="dpInput" placeholder="DP ID ou Email de l'utilisateur">
    <input id="amountInput" type="number" placeholder="Montant">
    <select id="actionType"><option value="add">Ajouter fonds</option><option value="remove">Retirer fonds</option></select>
    <button id="fundBtn" onclick="processFunds()">Valider Transaction</button>
</div>

<div class="box">
    <h3>🔍 Vérifier solde (DP ID ou Email)</h3>
    <input id="dpCheck" placeholder="Entrer DP ID ou Email">
    <button onclick="checkBalance()">Vérifier</button>
    <p id="checkResult" style="margin-top:10px; font-weight:bold;"></p>
</div>

<div class="box">
    <h3>📨 Demandes de recharge</h3>
    <div id="rechargeList"></div>
</div>

<div class="box">
    <h3>🔧 Fonctions Admin</h3>
    <input id="employeeEmail" placeholder="Email pour Rôle">
    <select id="employeeType"><option value="employee">Employé</option><option value="creator">Créateur</option><option value="admin">Admin</option></select>
    <button onclick="addEmployee()">Modifier Rôle</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
  projectId: "dpstore-officie",
  storageBucket: "dpstore-officie.appspot.com"
}));

let allUsers = [];

async function loadData(){
    const snapshot = await getDocs(collection(db, "users"));
    allUsers = snapshot.docs.map(d=>({id:d.id, data:d.data()}));
    document.getElementById("infoNote").innerText = `✅ ${allUsers.length} utilisateurs chargés`;
}

function findUser(query){
    return allUsers.find(u => (u.data.dp || u.id) === query || (u.data.email || "").toLowerCase() === query.toLowerCase());
}

async function processFunds(){
    const query = document.getElementById("dpInput").value.trim();
    const amount = parseFloat(document.getElementById("amountInput").value);
    const action = document.getElementById("actionType").value;
    const user = findUser(query);
    if(!user) return alert("Utilisateur introuvable");
    
    const currentBal = parseFloat(user.data.balance) || 0;
    const newBal = action === "add" ? currentBal + amount : currentBal - amount;
    
    await updateDoc(doc(db, "users", user.id), { balance: newBal });
    alert("✅ Solde mis à jour : " + newBal);
    loadData();
}

async function checkBalance(){
    const query = document.getElementById("dpCheck").value.trim();
    const user = findUser(query);
    document.getElementById("checkResult").innerText = user ? `💰 Solde : ${user.data.balance ?? 0}` : "❌ Introuvable";
}

async function addEmployee(){
    const email = document.getElementById("employeeEmail").value.trim().toLowerCase();
    const role = document.getElementById("employeeType").value;
    const user = allUsers.find(u => (u.data.email || "").toLowerCase() === email);
    if(user){ await updateDoc(doc(db, "users", user.id), { role: role }); alert("✅ Rôle mis à jour"); }
    else alert("❌ Email introuvable");
}

// Global scope
window.processFunds = processFunds;
window.checkBalance = checkBalance;
window.addEmployee = addEmployee;

await loadData();
</script>

<style>.show { display: block; }</style>
</body>
</html>
