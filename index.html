<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPSTORE — Connexion / Inscription</title>
  
  <!-- Ajout de Google Fonts pour une typographie moderne -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BASE */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: "Inter", sans-serif; 
    }
    
    body { 
      /* Un fond bleu très foncé et élégant */
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      flex-direction: column; 
    }

    /* CONTENEUR PRINCIPAL (Effet Glassmorphism) */
    .container { 
      width: 90%; 
      max-width: 420px; 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(10px);
      padding: 40px 30px; 
      border-radius: 16px; 
      /* Ombre bleue et bordure subtile pour le côté "Pro" */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 15px rgba(56, 189, 248, 0.2); 
      text-align: center; 
      border: 1px solid rgba(56, 189, 248, 0.3); 
    }

    /* TITRE */
    h1 { 
      /* Bleu clair très visible */
      color: #38bdf8; 
      font-size: 2em; 
      font-weight: 700;
      margin-bottom: 5px; 
      letter-spacing: 1px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9em;
      margin-bottom: 25px;
    }

    /* INPUTS */
    input { 
      width: 100%; 
      padding: 14px 16px; 
      margin: 8px 0; 
      outline: none; 
      border-radius: 8px; 
      background: rgba(15, 23, 42, 0.8); 
      color: #e2e8f0; 
      font-size: 14px; 
      border: 1px solid #334155; 
      transition: all 0.3s ease;
    }
    
    input::placeholder {
      color: #64748b;
    }

    /* Effet quand on clique sur l'input */
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* BOUTONS */
    button { 
      width: 100%; 
      padding: 14px; 
      margin-top: 10px;
      border: none; 
      border-radius: 8px; 
      /* Dégradé bleu dynamique */
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%); 
      color: #ffffff; 
      font-size: 15px;
      font-weight: 600; 
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s; 
    }

    button:hover { 
      background: linear-gradient(90deg, #0369a1 0%, #0284c7 100%); 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }

    /* TEXTE SWITCH (Déjà un compte ?) */
    .switch { 
      color: #94a3b8; 
      font-size: 13px; 
      margin-top: 20px; 
      cursor: pointer; 
      transition: color 0.3s ease;
    }
    
    .switch:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    /* FOOTER */
    .footer { 
      margin-top: 30px; 
      font-size: 12px; 
      color: #64748b; 
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>DPSTORE</h1>
    
    <!-- FORMULAIRE INSCRIPTION -->
    <div id="signup">
      <p class="subtitle">Créer ton compte</p>
      <input type="text" id="username" placeholder="Nom d'utilisateur" required />
      <input type="email" id="email" placeholder="Adresse email" required />
      <input type="password" id="password" placeholder="Mot de passe" required />
      <button onclick="sendVerificationCode()">Recevoir le code</button>

      <input type="text" id="code" placeholder="Entre le code reçu" style="margin-top:20px;" />
      <button onclick="verifyCode()" style="background: linear-gradient(90deg, #10b981 0%, #34d399 100%);">Valider le compte</button>
      
      <p class="switch" onclick="toggleForms()">Déjà un compte ? Se connecter</p>
    </div>

    <!-- FORMULAIRE CONNEXION -->
    <div id="login" style="display: none;">
      <p class="subtitle">Connexion à ton espace</p>
      <input type="email" id="loginEmail" placeholder="Adresse email" required />
      <input type="password" id="loginPassword" placeholder="Mot de passe" required />
      <button onclick="loginUser()">Se connecter</button>
      
      <p class="switch" onclick="toggleForms()">Pas encore inscrit ? Créer un compte</p>
    </div>
  </div>

  <p class="footer">© 2025 DPSTORE — Technologie avancée</p>

  <!-- ==============================================
       NE PAS TOUCHER : LOGIQUE JS EXACTEMENT IDENTIQUE 
       ============================================== -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      doc,
      getDoc,
      setDoc,
      addDoc,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
      authDomain: "dpstore-officie.firebaseapp.com",
      projectId: "dpstore-officie",
      storageBucket: "dpstore-officie.firebasestorage.app",
      messagingSenderId: "903943973062",
      appId: "1:903943973062:web:6501a2ec167adb31258fc7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("5gObExmJ85l0pSXC3");

    let pendingRegistration = { email: null, username: null, password: null, verificationCode: null };

    // ===== Utils =====
    async function findUserByEmail(email) {
      const q = query(collection(db, "users"), where("email", "==", email.toLowerCase()));
      const snaps = await getDocs(q);
      if (snaps.empty) return null;
      return { id: snaps.docs[0].id, data: snaps.docs[0].data() };
    }

    async function getNextDPFromFirestore() {
      const counterRef = doc(db, "counters", "dp");
      return await runTransaction(db, async tx => {
        const snap = await tx.get(counterRef);
        if (!snap.exists()) { tx.set(counterRef, { last: 1 }); return "DP000001"; }
        const next = snap.data().last + 1;
        tx.update(counterRef, { last: next });
        return "DP" + String(next).padStart(6, "0");
      });
    }

    async function saveUserToFirestore(user) {
      const id = encodeURIComponent(user.email.toLowerCase());
      const userRef = doc(db, "users", id);
      await setDoc(userRef, user, { merge: true });
    }

    function getRoleByEmail(email) {
      const CREATOR_EMAILS = ["christopherantoine773@gmail.com"];
      const EMPLOYEE_EMAILS = [
        "pilotecitizen@gmail.com",
        "ladouceurlorvynsky@gmail.com",
        "doresmaworldens@gmail.com",
        "mathieulherisson99@gmail.com"
      ];
      if (CREATOR_EMAILS.includes(email)) return "creator";
      if (EMPLOYEE_EMAILS.includes(email)) return "employee";
      return "user";
    }

    // ===== Signup =====
    function generateCode() { return Math.floor(100000 + Math.random() * 900000); }

    async function sendVerificationCode() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !username || !password) return alert("⚠️ Remplis tous les champs !");

      if (await findUserByEmail(email)) return alert("⚠️ Ce compte existe déjà !");

      const code = generateCode();
      pendingRegistration = { email, username, password, verificationCode: String(code) };

      const params = { user_email: email, to_name: username, message: String(code) };
      emailjs.send("service_1tnwnvu", "template_7o06ag8", params)
        .then(() => alert("✅ Code envoyé !"))
        .catch(err => { console.error(err); alert("❌ Erreur envoi email"); });
    }

    async function verifyCode() {
      const entered = document.getElementById("code").value.trim();
      if (!pendingRegistration.verificationCode) return alert("⚠️ Aucun code en attente.");
      if (entered !== pendingRegistration.verificationCode) return alert("❌ Code incorrect !");

      const dp = await getNextDPFromFirestore();
      const role = getRoleByEmail(pendingRegistration.email);

      const userObj = {
        username: pendingRegistration.username,
        email: pendingRegistration.email,
        password: pendingRegistration.password,
        role,
        credits: 0,
        balance: 0,
        dp,
        photo: "https://i.imgur.com/2XnKZ9R.png",
        lastLogin: new Date().toLocaleString(),
        createdAt: new Date().toISOString()
      };

      await saveUserToFirestore(userObj);

      // sessionStorage
      const userPayload = { email: userObj.email, username: userObj.username, dp: dp, role, credits: 0, balance: 0 };
      sessionStorage.setItem("dpstore_user", JSON.stringify(userPayload));

      alert("🎉 Compte créé !");
      window.location.href = role === "creator" ? "creator-space.html" : "profil.html";
    }

    // ===== Login =====
    async function loginUser() {
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value.trim();
      if (!email || !password) return alert("⚠️ Remplis tous les champs !");

      const found = await findUserByEmail(email);
      if (!found) return alert("⚠️ Aucun compte trouvé !");
      if (found.data.password !== password) return alert("❌ Mot de passe incorrect !");

      // update lastLogin
      await setDoc(doc(db, "users", found.id), { lastLogin: new Date().toLocaleString() }, { merge: true });

      const userPayload = {
        email: found.data.email,
        username: found.data.username,
        dp: found.data.dp,
        role: found.data.role || "user",
        credits: found.data.credits || 0,
        balance: found.data.balance || 0
      };

      sessionStorage.setItem("dpstore_user", JSON.stringify(userPayload));

      // Redirection sécurisée
      const role = (userPayload.role || "user").toLowerCase();
      window.location.href = role === "creator" || role === "admin" ? "creator-space.html" : "profil.html";
    }

    function toggleForms() {
      const s = document.getElementById("signup");
      const l = document.getElementById("login");
      s.style.display = s.style.display === "none" ? "block" : "none";
      l.style.display = l.style.display === "none" ? "block" : "none";
    }

    window.sendVerificationCode = sendVerificationCode;
    window.verifyCode = verifyCode;
    window.loginUser = loginUser;
    window.toggleForms = toggleForms;
  </script>
</body>
</html>
