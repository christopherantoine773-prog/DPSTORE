<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Espace Utilisateurs — DPSTORE</title>
<!-- Importation Google Fonts et FontAwesome cohérentes avec les autres fichiers -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f8fafc;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

/* HEADER */
header{
    width: 100%;
    max-width: 1200px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 20px 25px;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    box-sizing: border-box;
}
header h1{
    color: #38bdf8;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
}
header button{
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
}
header button:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
}

/* FILTRE */
.filter-container{
    width: 100%;
    max-width: 1200px;
    margin-bottom: 30px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    background: rgba(30, 41, 59, 0.5);
    padding: 15px 20px;
    border-radius: 14px;
    border: 1px solid #334155;
    box-sizing: border-box;
}
.filter-container label {
    font-size: 0.9rem;
    color: #94a3b8;
    font-weight: 500;
}
.filter-container select, .filter-container input{
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f8fafc;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    outline: none;
    transition: 0.3s;
}
.filter-container select:focus, .filter-container input:focus{
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}
.filter-container input {
    flex-grow: 1;
    min-width: 200px;
}

/* CARDS */
.cards-container{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1200px;
}

.card{
    background: rgba(30, 41, 59, 0.6);
    border-radius: 16px;
    padding: 25px;
    border: 1px solid #334155;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.card:hover{
    transform: translateY(-5px);
    border-color: #38bdf8;
    box-shadow: 0 12px 40px rgba(56, 189, 248, 0.15);
}
.card img{
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #38bdf8;
    display: block;
    margin: 0 auto 15px auto;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
}
.card h3{
    margin: 0 0 10px 0;
    color: #f8fafc;
    font-size: 1.15rem;
}
.card p{
    margin: 6px 0;
    font-size: 0.9rem;
    color: #94a3b8;
    width: 100%;
    text-align: left;
    display: flex;
    justify-content: space-between;
}
.card p b {
    color: #f8fafc;
}
.card button{
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
}
.card button:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
}

.status{
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.75rem;
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.status.user{background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid #64748b;}
.status.employee{background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981;}
.status.creator{background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b;}
.status.admin{background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444;}

/* MODAL */
.modal{
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content{
    background: #1e293b;
    padding: 30px;
    border-radius: 16px;
    border: 1px solid #334155;
    width: 90%;
    max-width: 650px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.modal-content h2{
    color: #38bdf8;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.3rem;
}
.modal-content p{
    color: #94a3b8;
    margin: 8px 0;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
}
.modal-content p b {
    color: #f8fafc;
}
.modal-content button.close{
    position: absolute;
    top: 20px;
    right: 20px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    border: 1px solid #ef4444;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}
.modal-content button.close:hover {
    background: #ef4444;
    color: white;
}

#profileDetails img {
    border: 2px solid #38bdf8;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
}

/* TRANSACTIONS */
.transaction{
    background: rgba(15, 23, 42, 0.6);
    padding: 12px 15px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #334155;
    border-left: 4px solid #38bdf8;
    font-size: 0.9rem;
    color: #f8fafc;
}
.transaction.in{border-left-color: #10b981;}
.transaction.out{border-left-color: #ef4444;}
</style>
</head>
<body>

<header>
    <h1><i class="fa-solid fa-users-gear"></i> ESPACE UTILISATEURS</h1>
    <button onclick="location.href='profil.html'"><i class="fa-solid fa-arrow-left"></i> Retour</button>
</header>

<div class="filter-container">
    <label for="roleFilter">Filtrer par rôle:</label>
    <select id="roleFilter" onchange="filterUsers()">
        <option value="all">Tous</option>
        <option value="user">Utilisateur</option>
        <option value="employee">Employé</option>
        <option value="creator">Créateur</option>
        <option value="admin">Admin</option>
    </select>
    <input type="text" id="searchUser" placeholder="Rechercher par nom ou email..." oninput="filterUsers()">
</div>

<div class="cards-container" id="cardsContainer">
    <p style="text-align:center; color: #94a3b8; grid-column: 1 / -1;">Chargement des utilisateurs...</p>
</div>

<!-- MODAL PROFIL -->
<div class="modal" id="profileModal">
    <div class="modal-content" id="modalContent">
        <button class="close" onclick="closeModal()">✕</button>
        <div id="profileDetails"></div>
        <button id="toggleTransactionsBtn" style="margin-top:20px; width:100%; padding:12px; border:none; border-radius:10px; background:linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%); color:white; font-weight:600; cursor:pointer; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);">📄 Voir Transactions</button>
        <div id="transactionsList" style="display:none; margin-top:15px;"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHjL2jDNNbb4P6yIok_GTw8r6FMOyYTiw",
  authDomain: "dpstore-officie.firebaseapp.com",
  projectId: "dpstore-officie",
  storageBucket: "dpstore-officie.appspot.com",
  messagingSenderId: "903943973062",
  appId: "1:903943973062:web:6501a2ec167adb31258fc7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allUsers = [];

async function loadUsers(){
    const userCol = collection(db,"users");
    const snapshot = await getDocs(userCol);
    allUsers = snapshot.docs.map(docSnap => ({ id: docSnap.id, data: docSnap.data() || {} }));
    renderUsers(allUsers);
}

function renderUsers(users){
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";
    if(users.length === 0){
        container.innerHTML = "<p style='text-align:center; color: #94a3b8; grid-column: 1 / -1;'>Aucun utilisateur trouvé</p>";
        return;
    }
    const fragment = document.createDocumentFragment();
    users.forEach(user => {
        const data = user.data;
        const dp = data.dp || user.id;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <img src="${data.photo || 'https://via.placeholder.com/100'}" alt="Photo">
            <h3>${data.username || "Non défini"}</h3>
            <p><b>Email:</b> <span>${data.email || "—"}</span></p>
            <p><b>DP-ID:</b> <span>${dp}</span></p>
            <p><b>Crédits / Solde:</b> <span>${data.credits ?? 0} / ${data.balance ?? 0}</span></p>
            <p><b>Créé le:</b> <span>${data.createdAt || "—"}</span></p>
            <span class="status ${data.role || 'user'}">${data.role || 'user'}</span>
            <button onclick="viewProfile('${dp}')">Voir Profil</button>
        `;
        fragment.appendChild(card);
    });
    container.appendChild(fragment);
}

function filterUsers(){
    const role = document.getElementById("roleFilter").value;
    const keyword = document.getElementById("searchUser").value.toLowerCase();
    let filtered = allUsers;

    if(role !== "all") filtered = filtered.filter(u => (u.data.role || 'user') === role);
    if(keyword) filtered = filtered.filter(u => 
        (u.data.username || "").toLowerCase().includes(keyword) || 
        (u.data.email || "").toLowerCase().includes(keyword)
    );

    renderUsers(filtered);
}

window.closeModal = function closeModal(){
    document.getElementById("profileModal").style.display = "none";
}

window.viewProfile = async function viewProfile(dp){
    const userDoc = allUsers.find(u => (u.data.dp || u.id) === dp);
    if(!userDoc) return alert("Utilisateur introuvable !");
    const data = userDoc.data;

    const username = data.username || "Non défini";
    const email = data.email || "—";
    const role = data.role || "user";
    const credits = data.credits ?? 0;
    const balance = data.balance ?? 0;
    const createdAt = data.createdAt || "—";
    const photo = data.photo || "https://via.placeholder.com/100";

    const profileDiv = document.getElementById("profileDetails");
    profileDiv.innerHTML = `
        <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
            <img src="${photo}" width="80" height="80" style="border-radius:50%; object-fit:cover;">
            <div>
                <h2 style="margin:0 0 5px 0;">${username}</h2>
                <span class="status ${role}">${role}</span>
            </div>
        </div>
        <p><b>Email:</b> <span>${email}</span></p>
        <p><b>DP-ID:</b> <span>${dp}</span></p>
        <p><b>Crédits:</b> <span>${credits}</span></p>
        <p><b>Solde:</b> <span>${balance}</span></p>
        <p><b>Créé le:</b> <span>${createdAt}</span></p>
    `;

    const transDiv = document.getElementById("transactionsList");
    const toggleBtn = document.getElementById("toggleTransactionsBtn");
    transDiv.style.display = "none";
    toggleBtn.textContent = "📄 Voir Transactions";

    toggleBtn.onclick = async () => {
        if(transDiv.style.display === "none"){
            transDiv.style.display = "block";
            toggleBtn.textContent = "📄 Masquer Transactions";

            if(transDiv.innerHTML === "" || transDiv.innerHTML.includes("Chargement")){
                transDiv.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Chargement des transactions...</p>";
                try {
                    const transCol = collection(db, "transactions");
                    const q = query(transCol, where("dpID", "==", dp));
                    const snapshot = await getDocs(q);
                    if(snapshot.empty){
                        transDiv.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Aucune transaction.</p>";
                    } else {
                        transDiv.innerHTML = "";
                        snapshot.forEach(docSnap => {
                            const t = docSnap.data();
                            transDiv.innerHTML += `
                                <div class="transaction ${t.type || 'in'}">
                                    <b>${t.type === 'in' ? '+' : '-'}</b> ${t.amount ?? 0} crédits — ${t.reason || 'N/A'} — <small style="color:#94a3b8;">${t.date || '—'}</small>
                                </div>
                            `;
                        });
                    }
                } catch(e){
                    console.error(e);
                    transDiv.innerHTML = "<p style='color:#f87171; text-align:center;'>Erreur chargement transactions.</p>";
                }
            }
        } else {
            transDiv.style.display = "none";
            toggleBtn.textContent = "📄 Voir Transactions";
        }
    };

    document.getElementById("profileModal").style.display = "flex";
}

loadUsers().catch(err=>console.error(err));
</script>

</body>
</html>
