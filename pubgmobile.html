<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPSTORE — PUBG Mobile UC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f8fafc;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* --- HEADER --- */
  header {
    backdrop-filter: blur(10px);
    background: rgba(30, 41, 59, 0.8);
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .btn-back {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid #38bdf8;
    color: #38bdf8;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .btn-back:hover {
    background: #38bdf8;
    color: #0f172a;
  }

  .logo-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 1px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .balance-tag {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    color: #fcd34d;
    font-size: 0.9rem;
  }

  .cart-btn {
    background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
  }

  /* --- CONTAINER PRINCIPAL --- */
  .container {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
  }

  h1.page-title {
    font-size: 1.8rem;
    color: #ffffff;
    margin-bottom: 20px;
    font-weight: 700;
  }

  /* --- MODULE JOUEUR (EMAIL & ID) --- */
  .player-module {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 30px;
    backdrop-filter: blur(5px);
  }

  .player-module h3 {
    color: #38bdf8;
    font-size: 1.1rem;
    margin-bottom: 12px;
  }

  .input-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-group input {
    flex: 1;
    min-width: 200px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid #334155;
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  .input-group input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  /* --- LISTE DES PRODUITS (CARTES) --- */
  .products-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    transition: transform 0.2s, border-color 0.2s;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(56, 189, 248, 0.5);
  }

  .card-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .game-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 2px solid #38bdf8;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #38bdf8;
    flex-shrink: 0;
  }

  .card-text h3 {
    color: #ffffff;
    font-size: 1.2rem;
    margin-bottom: 4px;
  }

  .badges {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  .badge-status {
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.4);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-game {
    background: rgba(51, 65, 85, 0.6);
    color: #94a3b8;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
  }

  .price {
    color: #38bdf8;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .btn-buy {
    background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
    color: #0f172a;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }

  .btn-buy:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
  }

  @media (max-width: 600px) {
    .card {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }
    .card-info {
      flex-direction: column;
    }
    .btn-buy {
      width: 100%;
    }
  }
</style>
</head>
<body>

<header>
  <div class="nav-left">
    <a href="produits.html" class="btn-back">⬅ Retour</a>
    <span class="logo-title">DP-PUBG</span>
  </div>
  <div class="header-right">
    <div class="balance-tag" id="user-balance">10500 G</div>
    <button class="cart-btn" onclick="openCart()">🛒 Panier (<span id="cart-count">0</span>)</>
  </div>
</header>

<div class="container">
  <h1 class="page-title">PUBG MOBILE UC</h1>

  <!-- MODULE DE REMPLISSAGE EMAIL & ID -->
  <div class="player-module">
    <h3>🎯 Informations de livraison</h3>
    <div class="input-group">
      <input type="text" id="playerId" placeholder="Entre ton ID PUBG (ex: 5123456789)" required />
      <input type="email" id="playerEmail" placeholder="Ton adresse email" required />
    </div>
  </div>

  <!-- LISTE DES PRODUITS -->
  <div class="products-grid">

    <div class="card">
      <div class="card-info">
        <div class="game-icon">🎯</div>
        <div class="card-text">
          <h3>60 UC</h3>
          <div class="badges">
            <span class="badge-status">Disponible</span>
            <span class="badge-game">PUBG MOBILE</span>
          </div>
          <div class="price">216 HTG</div>
        </div>
      </div>
      <button class="btn-buy" onclick="addToCart('60 UC', 216)">AJOUTER AU PANIER</button>
    </div>

    <div class="card">
      <div class="card-info">
        <div class="game-icon">🎯</div>
        <div class="card-text">
          <h3>120 UC</h3>
          <div class="badges">
            <span class="badge-status">Disponible</span>
            <span class="badge-game">PUBG MOBILE</span>
          </div>
          <div class="price">420 HTG</div>
        </div>
      </div>
      <button class="btn-buy" onclick="addToCart('120 UC', 420)">AJOUTER AU PANIER</button>
    </div>

    <div class="card">
      <div class="card-info">
        <div class="game-icon">🎯</div>
        <div class="card-text">
          <h3>325 UC</h3>
          <div class="badges">
            <span class="badge-status">Disponible</span>
            <span class="badge-game">PUBG MOBILE</span>
          </div>
          <div class="price">1020 HTG</div>
        </div>
      </div>
      <button class="btn-buy" onclick="addToCart('325 UC', 1020)">AJOUTER AU PANIER</button>
    </div>

    <div class="card">
      <div class="card-info">
        <div class="game-icon">🎯</div>
        <div class="card-text">
          <h3>660 UC</h3>
          <div class="badges">
            <span class="badge-status">Disponible</span>
            <span class="badge-game">PUBG MOBILE</span>
          </div>
          <div class="price">1980 HTG</div>
        </div>
      </div>
      <button class="btn-buy" onclick="addToCart('660 UC', 1980)">AJOUTER AU PANIER</button>
    </div>

  </div>
</div>

<script>
  // Charger le solde utilisateur depuis sessionStorage si disponible
  let user = JSON.parse(sessionStorage.getItem("dpstore_user") || "{}");
  if(user.balance !== undefined) {
    document.getElementById("user-balance").textContent = user.balance + " G";
  }

  // Logique panier simple sécurisée avec vérification ID et Email
  let cart = JSON.parse(localStorage.getItem("dpstore_cart") || "[]");
  document.getElementById("cart-count").textContent = cart.length;

  function addToCart(productName, price) {
    const playerId = document.getElementById("playerId").value.trim();
    const playerEmail = document.getElementById("playerEmail").value.trim();

    if(!playerId || !playerEmail) {
      alert("⚠️ Merci de remplir ton ID PUBG et ton email avant d'ajouter un produit !");
      return;
    }

    cart.push({ product: productName, price: price, id: playerId, email: playerEmail });
    localStorage.setItem("dpstore_cart", JSON.stringify(cart));
    document.getElementById("cart-count").textContent = cart.length;
    alert(`✅ ${productName} ajouté au panier pour l'ID : ${playerId}`);
  }

  function openCart() {
    window.location.href = "cart.html";
  }
</script>

</body>
</html>
