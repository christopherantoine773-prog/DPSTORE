<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPSTORE | PUBG MOBILE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #0b0f1c;
    margin: 0;
    padding: 0;
    color: #fff;
  }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid rgba(0,255,179,0.2);
  }

  .back-btn {
    background: none;
    border: 2px solid #00ffb3;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: #00ffb3;
    font-weight: bold;
    font-size: 0.85rem;
  }

  .logo {
    display: flex;
    align-items: center;
    color: #00ffb3;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 1px;
  }

  /* Correction du bug d'alignement du panier et du solde */
  .right-box {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .balance-bubble {
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(0,255,179,0.08);
    color: #00ffb3;
    font-weight: 700;
    border: 1px solid rgba(0,255,179,0.15);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .cart-btn {
    cursor: pointer;
    font-size: 0.85rem;
    background: rgba(0,255,179,0.15);
    border: 1px solid #00ffb3;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: bold;
    color: #00ffb3;
    white-space: nowrap;
  }

  /* PRODUITS */
  .product-box {
    background: #111726;
    margin: 15px;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 0 12px rgba(0,255,179,0.08);
    border: 1px solid rgba(0,255,179,0.1);
  }
  .product-header {
    display: flex;
    align-items: center;
  }
  .product-img {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(0,255,179,0.3);
    background: #0e1320;
  }
  .product-info {
    margin-left: 14px;
    flex: 1;
  }
  .product-name {
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
  }
  .status-tag {
    display: inline-block;
    background: #00ff80;
    color: #000;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: bold;
    margin-top: 4px;
  }
  .category-tag {
    display: inline-block;
    background: #2a344a;
    color: #fff;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.75rem;
    margin-left: 4px;
  }
  .price {
    margin-top: 6px;
    color: #00ffb3;
    font-size: 1rem;
    font-weight: bold;
  }

  .add-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    background: #00ffb3;
    color: #000;
    cursor: pointer;
    transition: 0.2s;
  }
  .add-btn:hover {
    background: #00cc8f;
  }

  /* POPUP FORMULAIRE */
  #popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 9999;
  }
  .popup-content {
    width: 90%;
    max-width: 360px;
    background: #111726;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 0 20px rgba(0,255,179,0.3);
    border: 1px solid #00ffb344;
  }

  .form-input {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: #0e1320;
    border-radius: 8px;
    border: 1px solid rgba(0,255,179,0.3);
    color: white;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
  }
  .form-input:focus {
    border-color: #00ffb3;
  }

  .submit-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: #00ffb3;
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .close-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: rgba(255, 59, 59, 0.2);
    color: #ff3b3b;
    border: 1px solid #ff3b3b;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>
  <button class="back-btn" onclick="window.location.href='produits.html'">← Retour</button>
  <div class="logo">🎮 DP-PUBG</div>
  <div class="right-box">
    <div class="balance-bubble" id="balanceBox">0 G</div>
    <div class="cart-btn" onclick="gotoCart()">🛒 <span id="cartCount">0</span></div>
  </div>
</header>

<h2 style="margin:20px 15px 10px 15px; color:#00ffb3; font-size:1.4rem;">PUBG MOBILE UC</h2>

<div id="product-list"></div>

<!-- POPUP MODULE COMMANDE -->
<div id="popup">
  <div class="popup-content">
    <h3 id="popupTitle" style="margin:0 0 10px 0; color:#00ffb3; font-size:1.1rem;"></h3>
    <p style="font-size:0.85rem; color:#aaa; margin-bottom:10px;">Entre ton email et ton ID PUBG pour valider la commande :</p>

    <input id="popupEmail" class="form-input" placeholder="Adresse email" type="email">
    <input id="popupUID" class="form-input" placeholder="ID (UID) du compte PUBG" type="text">

    <button class="submit-btn" onclick="validateForm()">CONFIRMER LA COMMANDE</button>
    <button class="close-btn" onclick="closePopup()">Annuler</button>
  </div>
</div>

<script>
/* ===================================================
   🔐 SÉCURITÉ + PROFIL CONNECTÉ (sessionStorage)
=================================================== */
function safeParse(str){
  try{ return JSON.parse(str); }catch(e){ return null; }
}

let user = safeParse(sessionStorage.getItem("dpstore_user") || "null");

if(!user || !user.email || !user.dp || !user.username){
    alert("⚠ Accès refusé : vous devez être connecté.");
    window.location.href = "index.html";
}

/* PANIER LIÉ AU PROFIL (localStorage) */
function normalizeId(str){
  return String(str || "guest").toLowerCase()
    .replace(/[^a-z0-9@.-]/g,"_")
    .replace(/@/g,"_at_");
}
function getCartKey(){ return "cart_" + normalizeId(user.email); }
function loadCart(){ return JSON.parse(localStorage.getItem(getCartKey())||"[]"); }
function saveCart(cart){ localStorage.setItem(getCartKey(), JSON.stringify(cart)); }

/* UTIL */
function updateCartCount(){
  document.getElementById("cartCount").textContent = loadCart().length;
}
function updateBalanceUI(){
  user = safeParse(sessionStorage.getItem("dpstore_user") || "null") || user;
  const bal = (user && (user.balance ?? user.credits ?? user.balance === 0 ? (user.balance ?? user.credits) : null));
  document.getElementById("balanceBox").textContent = (bal !== null && bal !== undefined) ? (bal + " G") : "0 G";
}

/* NAV */
function gotoCart(){ window.location.href = "cart.html"; }

/* ===================================================
   🔥 PRODUITS PUBG (Images corrigées & stables)
=================================================== */
const products = [
  { uc: "60 UC",  price: 180, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150&auto=format&fit=crop&q=80" },
  { uc: "120 UC", price: 350, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150&auto=format&fit=crop&q=80" },
  { uc: "325 UC", price: 850, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150&auto=format&fit=crop&q=80" },
  { uc: "660 UC", price: 1650, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150&auto=format&fit=crop&q=80" },
  { uc: "1800 UC", price: 3500, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150&auto=format&fit=crop&q=80" }
];
products.forEach(p => p.price = Math.round(p.price * 1.20));

/* POPUP / FORM */
let selectedProduct = null;

function openForm(product){
  selectedProduct = product;
  document.getElementById("popupTitle").textContent = `${product.uc} — ${product.price} HTG`;
  
  // Pré-remplir l'email depuis le compte connecté
  document.getElementById("popupEmail").value = (user && user.email) ? user.email : "";
  document.getElementById("popupUID").value = "";
  
  document.getElementById("popup").style.display = "flex";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

/* VALIDATION ET AJOUT AU PANIER */
function validateForm(){
  const email = document.getElementById("popupEmail").value.trim();
  const uid  = document.getElementById("popupUID").value.trim();

  if(!email || !uid){
    alert("⚠ Merci de remplir ton adresse email et ton UID PUBG.");
    return;
  }

  const item = {
    name: selectedProduct.uc,
    price: selectedProduct.price,
    buyer: email,
    date: new Date().toLocaleString(),
    status: "En attente",
    meta: {
      uid: uid,
      accountName: email
    }
  };

  const cart = loadCart();
  cart.push(item);
  saveCart(cart);

  updateCartCount();
  closePopup();
  alert("✔ Produit ajouté au panier avec succès !");
}

/* AFFICHAGE PRODUITS */
const list = document.getElementById("product-list");
products.forEach(p => {
  const div = document.createElement("div");
  div.className = "product-box";
  div.innerHTML = `
    <div class="product-header">
      <img src="${p.img}" class="product-img" alt="PUBG UC">
      <div class="product-info">
        <div class="product-name">${p.uc}</div>
        <span class="status-tag">Disponible</span>
        <span class="category-tag">PUBG MOBILE</span>
        <div class="price">${p.price} HTG</div>
      </div>
    </div>
    <button class="add-btn">AJOUTER AU PANIER</button>
  `;
  div.querySelector("button").addEventListener("click", ()=> openForm(p));
  list.appendChild(div);
});

/* INITIAL UI SYNC */
updateBalanceUI();
updateCartCount();

window.addEventListener("storage", (ev) => {
  if(ev.key === "dpstore_user"){
    updateBalanceUI();
    updateCartCount();
  }
});
setInterval(updateBalanceUI, 1500);
</script>

</body>
</html>
